name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Leave empty for a draft dry-run.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-guard:
    name: validate release identity
    runs-on: ubuntu-latest
    steps:
      - name: validate tag and refuse existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then exit 0; fi
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid immutable release tag: $tag" >&2
            exit 1
          fi
          code="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          case "$code" in
            404) ;;
            200) echo "Release $tag already exists." >&2; exit 1 ;;
            *) cat /tmp/release.json >&2; echo "Release lookup failed with HTTP $code" >&2; exit 1 ;;
          esac

  test:
    name: test (ubuntu)
    needs: release-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: restore
        run: dotnet restore Glow.slnx
      - name: test
        run: dotnet test Glow.slnx --configuration Release --no-restore --logger "console;verbosity=normal"

  build:
    name: aot ${{ matrix.os_name }}-x64
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            rid: linux-x64
            archive_ext: tar.gz
            server_bin: Glow.Server
            cli_bin: Glow.Cli
          - os: windows-latest
            os_name: windows
            rid: win-x64
            archive_ext: zip
            server_bin: Glow.Server.exe
            cli_bin: Glow.Cli.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: resolve version
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF##*/}"
          input="${{ github.event.inputs.tag }}"
          if [ -n "$input" ]; then
            v="$input"
          elif [[ "$ref" == v* ]]; then
            v="$ref"
          else
            v="v0.0.0-dev+${GITHUB_SHA:0:8}"
          fi
          # $v is the display version (tag-like, e.g. v0.0.3 or v0.0.0-dev+abcd1234).
          # msbuild's -p:Version needs a bare x.y.z; strip 'v', pre-release, and metadata.
          no_v="${v#v}"
          no_pre="${no_v%%-*}"
          numeric="${no_pre%%+*}"
          # InformationalVersion is a free string; always attach a short SHA if the
          # version didn't already carry one, so any binary can be traced back.
          info="$no_v"
          if [[ "$info" != *+* ]]; then
            info="$info+${GITHUB_SHA:0:8}"
          fi
          echo "version=$v"           >> "$GITHUB_OUTPUT"
          echo "version_numeric=$numeric" >> "$GITHUB_OUTPUT"
          echo "version_info=$info"   >> "$GITHUB_OUTPUT"
          echo "resolved: display=$v, numeric=$numeric, info=$info"

      - name: publish Glow.Server
        run: >
          dotnet publish src/Glow.Server/Glow.Server.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Version=${{ steps.ver.outputs.version_numeric }}
          -p:InformationalVersion=${{ steps.ver.outputs.version_info }}
          -o publish/${{ matrix.rid }}/server

      - name: publish Glow.Cli
        run: >
          dotnet publish src/Glow.Cli/Glow.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Version=${{ steps.ver.outputs.version_numeric }}
          -p:InformationalVersion=${{ steps.ver.outputs.version_info }}
          -o publish/${{ matrix.rid }}/cli

      - name: verify binary metadata
        shell: bash
        run: |
          set -euo pipefail
          expected_build='${{ steps.ver.outputs.version_info }}'
          expected_protocol="$(sed -n 's/.*ProtocolVersion = \([0-9][0-9]*\).*/\1/p' src/Glow.Shared/Meta.cs)"
          server_json="$("publish/${{ matrix.rid }}/server/${{ matrix.server_bin }}" --version-json)"
          cli_json="$("publish/${{ matrix.rid }}/cli/${{ matrix.cli_bin }}" --version-json)"
          for payload in "$server_json" "$cli_json"; do
            test "$(jq -r .buildVersion <<<"$payload")" = "$expected_build"
            test "$(jq -r .protocolVersion <<<"$payload")" = "$expected_protocol"
          done

      - name: stage payload
        shell: bash
        run: |
          set -euo pipefail
          stage="stage/glow-${{ steps.ver.outputs.version }}-${{ matrix.os_name }}-x64"
          mkdir -p "$stage"
          cp "publish/${{ matrix.rid }}/server/${{ matrix.server_bin }}" "$stage/"
          cp "publish/${{ matrix.rid }}/cli/${{ matrix.cli_bin }}" "$stage/"
          cp README.md "$stage/"
          protocol="$(sed -n 's/.*ProtocolVersion = \([0-9][0-9]*\).*/\1/p' src/Glow.Shared/Meta.cs)"
          jq -n \
            --arg tag "${{ steps.ver.outputs.version }}" \
            --arg buildVersion "${{ steps.ver.outputs.version_info }}" \
            --arg commitSha "${GITHUB_SHA}" \
            --argjson protocolVersion "$protocol" \
            '{schemaVersion:1, tag:$tag, buildVersion:$buildVersion, commitSha:$commitSha, protocolVersion:$protocolVersion}' \
            > "$stage/glow-build.json"
          ls -la "$stage"

      - name: archive (linux)
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          name="glow-${{ steps.ver.outputs.version }}-linux-x64"
          mkdir -p dist
          tar -C stage -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: archive (windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "glow-${{ steps.ver.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip" -Force
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glow-${{ matrix.os_name }}-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  unity-bundle:
    name: unity bundle (netstandard2.1)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: resolve version
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF##*/}"
          input="${{ github.event.inputs.tag }}"
          if [ -n "$input" ]; then
            v="$input"
          elif [[ "$ref" == v* ]]; then
            v="$ref"
          else
            v="v0.0.0-dev+${GITHUB_SHA:0:8}"
          fi
          no_v="${v#v}"
          no_pre="${no_v%%-*}"
          numeric="${no_pre%%+*}"
          info="$no_v"
          if [[ "$info" != *+* ]]; then
            info="$info+${GITHUB_SHA:0:8}"
          fi
          echo "version=$v"               >> "$GITHUB_OUTPUT"
          echo "version_numeric=$numeric" >> "$GITHUB_OUTPUT"
          echo "version_info=$info"       >> "$GITHUB_OUTPUT"
          echo "resolved: display=$v, numeric=$numeric, info=$info"

      # Publishing Glow.Client for its netstandard2.1 target collects
      # Glow.Client.dll + Glow.Shared.dll + LiteNetLib.dll into one
      # folder -- exactly what Unity's Assets/Plugins/Glow/ needs.
      - name: publish Glow.Client
        run: >
          dotnet publish src/Glow.Client/Glow.Client.csproj
          -c Release
          -p:Version=${{ steps.ver.outputs.version_numeric }}
          -p:InformationalVersion=${{ steps.ver.outputs.version_info }}
          -o publish/unity-raw

      - name: stage unity bundle
        shell: bash
        run: |
          set -euo pipefail
          name="glow-${{ steps.ver.outputs.version }}-unity"
          stage="stage/${name}"
          mkdir -p "$stage"
          cp publish/unity-raw/Glow.Client.dll "$stage/"
          cp publish/unity-raw/Glow.Shared.dll "$stage/"
          cp publish/unity-raw/LiteNetLib.dll "$stage/"
          cp README.md "$stage/"
          protocol="$(sed -n 's/.*ProtocolVersion = \([0-9][0-9]*\).*/\1/p' src/Glow.Shared/Meta.cs)"
          jq -n \
            --arg tag "${{ steps.ver.outputs.version }}" \
            --arg buildVersion "${{ steps.ver.outputs.version_info }}" \
            --arg commitSha "${GITHUB_SHA}" \
            --argjson protocolVersion "$protocol" \
            '{schemaVersion:1, tag:$tag, buildVersion:$buildVersion, commitSha:$commitSha, protocolVersion:$protocolVersion}' \
            > "$stage/glow-build.json"
          ls -la "$stage"

      - name: archive
        shell: bash
        run: |
          set -euo pipefail
          name="glow-${{ steps.ver.outputs.version }}-unity"
          mkdir -p dist
          ( cd stage && zip -r "../dist/${name}.zip" "${name}" )
          ( cd dist && sha256sum "${name}.zip" > "${name}.zip.sha256" )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glow-unity
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release-manifest:
    name: release manifest
    needs: [build, unity-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: resolve version
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF##*/}"
          input="${{ github.event.inputs.tag }}"
          if [ -n "$input" ]; then v="$input"; elif [[ "$ref" == v* ]]; then v="$ref"; else v="v0.0.0-dev+${GITHUB_SHA:0:8}"; fi
          no_v="${v#v}"
          info="$no_v"
          if [[ "$info" != *+* ]]; then info="$info+${GITHUB_SHA:0:8}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version_info=$info" >> "$GITHUB_OUTPUT"
      - name: create manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          protocol="$(sed -n 's/.*ProtocolVersion = \([0-9][0-9]*\).*/\1/p' src/Glow.Shared/Meta.cs)"
          name="glow-${{ steps.ver.outputs.version }}-manifest.json"
          assets="$({
            find artifacts -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 |
              sort -z |
              while IFS= read -r -d '' file; do
                jq -n \
                  --arg name "$(basename "$file")" \
                  --argjson size "$(stat -c '%s' "$file")" \
                  --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" \
                  '{name:$name,size:$size,sha256:$sha256}'
              done
          } | jq -s 'sort_by(.name)')"
          jq -n \
            --arg tag "${{ steps.ver.outputs.version }}" \
            --arg buildVersion "${{ steps.ver.outputs.version_info }}" \
            --arg commitSha "${GITHUB_SHA}" \
            --argjson protocolVersion "$protocol" \
            --argjson assets "$assets" \
            '{schemaVersion:2, tag:$tag, buildVersion:$buildVersion, commitSha:$commitSha, protocolVersion:$protocolVersion, assets:$assets}' \
            > "dist/$name"
          ( cd dist && sha256sum "$name" > "$name.sha256" )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glow-release-manifest
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release
    needs: [build, unity-bundle, release-manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: list
        run: ls -la artifacts

      - name: create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          created=0
          cleanup() {
            if [[ "$created" == 1 ]]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          }
          trap cleanup ERR
          args=(release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft)
          if [[ "$tag" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
          created=1
          gh release upload "$tag" artifacts/* --repo "$GITHUB_REPOSITORY"

          release_id="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          remote_assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets")"
          for file in artifacts/*; do
            name="$(basename "$file")"
            expected_size="$(stat -c '%s' "$file")"
            expected_digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            test "$(jq -r --arg name "$name" '.[] | select(.name==$name) | .size' <<<"$remote_assets")" = "$expected_size"
            test "$(jq -r --arg name "$name" '.[] | select(.name==$name) | .digest' <<<"$remote_assets")" = "$expected_digest"
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          created=0
